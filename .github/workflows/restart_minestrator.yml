name: Minestrator-Restart

on:
  workflow_dispatch:


jobs:
  run_minestrator_restart:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v4

      # ========== 拉取私有仓库的 restart_minestrator.py ==========
      - name: 📥 拉取私有仓库脚本
        run: |
          git clone --depth 1 https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/gunqio/zhiyong.git temp_private_repo
          cp temp_private_repo/restart_minestrator.py ./
          rm -rf temp_private_repo
      # ============================================================

      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛡️ 启动 Xray 代理转发
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG_JSON }}
        run: |
          set -e

          echo "📦 下载并解压 Xray-core..."
          wget -q https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray-core

          echo "📝 写入节点配置..."
          echo "$XRAY_CONFIG" > xray-core/config.json

          echo "🚀 启动 Xray 服务..."
          cd xray-core
          ./xray run -c config.json > xray.log 2>&1 &
          XRAY_PID=$!
          echo "Xray PID: $XRAY_PID"

          # 等待代理端口就绪（最多 15 秒）
          for i in $(seq 1 15); do
            sleep 1
            if curl -s --connect-timeout 2 http://127.0.0.1:8080 -o /dev/null 2>/dev/null; then
              echo "✅ 代理端口 8080 已就绪 (等待 ${i}s)"
              break
            fi
            if ! kill -0 $XRAY_PID 2>/dev/null; then
              echo "❌ Xray 进程已退出!"
              echo "--- Xray 日志 ---"
              cat xray.log
              exit 1
            fi
          done

          # 输出日志，方便排查
          echo "--- Xray 日志 ---"
          cat xray.log

          echo "✅ 测试代理连通性并获取出口 IP..."

          # 尝试多种协议方式（Xray 入站可能是 SOCKS5 或 HTTP）
          EXPORT_IP=""

          # 1) 先试 SOCKS5（Xray 默认入站协议）
          echo "🔧 尝试 SOCKS5 代理..."
          if curl -s --max-time 10 -x socks5h://127.0.0.1:8080 https://api.ipify.org -o /tmp/ip_result.txt 2>/tmp/ip_err.txt; then
            EXPORT_IP=$(cat /tmp/ip_result.txt)
            echo "SOCKS5 结果: [$EXPORT_IP]"
          else
            echo "SOCKS5 失败: $(cat /tmp/ip_err.txt | head -1)"
          fi

          # 2) 再试 HTTP
          if [ -z "$EXPORT_IP" ]; then
            echo "🔧 尝试 HTTP 代理..."
            if curl -s --max-time 10 -x http://127.0.0.1:8080 https://api.ipify.org -o /tmp/ip_result.txt 2>/tmp/ip_err.txt; then
              EXPORT_IP=$(cat /tmp/ip_result.txt)
              echo "HTTP 结果: [$EXPORT_IP]"
            else
              echo "HTTP 失败: $(cat /tmp/ip_err.txt | head -1)"
            fi
          fi

          echo ""
          echo "出口 IP: $EXPORT_IP"

          if [ -z "$EXPORT_IP" ]; then
            echo "❌ 代理连通性测试失败"
            echo "  - Xray 已启动但无法访问外网，请检查:"
            echo "    1. XRAY_CONFIG_JSON 是否为合法的 Xray 配置文件"
            echo "    2. 节点是否有效（地址/端口/uuid 是否正确）"
            echo "    3. 入站端口是否为 8080"
            echo "--- 详细诊断 (SOCKS5 verbose) ---"
            curl -v --max-time 10 -x socks5h://127.0.0.1:8080 https://api.ipify.org 2>&1 || true
            exit 1
          fi

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot

      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase
          seleniumbase install chromedriver
          seleniumbase install chrome

      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          MINESTRATOR_ACCOUNT: ${{ secrets.MINESTRATOR_ACCOUNT }}
          MINESTRATOR_SERVER_ID: ${{ secrets.MINESTRATOR_SERVER_ID }}
          MINESTRATOR_BOX_ID: ${{ secrets.MINESTRATOR_BOX_ID }}
          MINESTRATOR_AUTH: ${{ secrets.MINESTRATOR_AUTH }}
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python restart_minestrator.py

      - name: 📸 上传截图（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"

      - name: 📋 上传 Xray 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xray-log
          path: |
            xray-core/xray.log
            xray-core/config.json
